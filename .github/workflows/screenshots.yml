name: Screenshots

# Renders the real Compose screens with Roborazzi and uploads the PNGs.
# This is the "preview" of what the app actually looks like — real UI, not a mock.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Render screens (Roborazzi)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Repository secret GOOGLE_SERVICES_JSON_B64 is not set."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Provide .env
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
        run: |
          {
            echo "AGORA_APP_ID=${AGORA_APP_ID}"
            echo "RAZORPAY_KEY=${RAZORPAY_KEY}"
          } > .env

      - name: Record screenshots (Roborazzi)
        run: gradle recordRoborazziDebug --no-daemon --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn
