name: Screenshots

# Renders the real Compose screens with Roborazzi and uploads the PNGs.
# This is the "preview" of what the app actually looks like — real UI, not a mock.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Render screens (Roborazzi)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Real config comes from the secret. If it is absent we drop in a
      # placeholder so the build can run — the screenshot tests render pure UI
      # and never touch Firebase.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
            echo "Using real google-services.json from secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_B64 not set — using a placeholder."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "devbhasha-ci-placeholder",
              "storage_bucket": "devbhasha-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.aistudio.devbhasha.kxmpzq" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYPLACEHOLDER000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Provide .env
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
        run: |
          {
            echo "AGORA_APP_ID=${AGORA_APP_ID}"
            echo "RAZORPAY_KEY=${RAZORPAY_KEY}"
          } > .env

      - name: Record screenshots (Roborazzi)
        run: gradle recordRoborazziDebug --no-daemon --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn
