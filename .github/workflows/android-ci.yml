name: Android CI

# Build gate for the Devbhasha app. Required by branch protection on `main`.
# A PR cannot merge unless this job is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Matches gradle/wrapper/gradle-wrapper.properties (gradle-9.3.1).
          gradle-version: "9.3.1"

      # The google-services plugin fails the build if google-services.json is
      # absent, so it is injected from a repository secret (base64).
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Repository secret GOOGLE_SERVICES_JSON_B64 is not set."
            echo "Add it (base64 of app/google-services.json) under Settings > Secrets."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      # Real keys are never committed; they come from repository secrets.
      - name: Provide .env
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
        run: |
          {
            echo "AGORA_APP_ID=${AGORA_APP_ID}"
            echo "RAZORPAY_KEY=${RAZORPAY_KEY}"
          } > .env

      - name: Assemble (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unit tests (Robolectric / Roborazzi)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Android Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
