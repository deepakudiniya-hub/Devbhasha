name: Functions CI

# Validates the Cloud Functions and Firestore rules whenever they change.

on:
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
  workflow_dispatch:

concurrency:
  group: functions-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functions:
    name: Functions & rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: node --check functions/index.js
