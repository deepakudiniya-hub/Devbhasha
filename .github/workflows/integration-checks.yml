name: Paired app integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paired-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint and assemble user app
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-app-checks
          path: |
            app/build/reports
            app/build/test-results
            app/build/outputs/apk/debug/*.apk
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check functions/index.js
      - run: node --test functions/test/*.test.cjs
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix integration-tests --no-audit --no-fund
      - run: npm ci --prefix functions --no-audit --no-fund
      - name: Real Firestore emulator security and paired-message tests
        run: integration-tests/node_modules/.bin/firebase emulators:exec --project demo-devbhasha --only firestore --config firebase.test.json "node --test integration-tests/rules.test.cjs && node --test integration-tests/server.test.cjs"